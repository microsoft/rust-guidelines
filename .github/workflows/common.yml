name: Common Steps

on:
  workflow_call:

jobs:
  Tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        lfs: true

    - name: Install mdBook
      run: |
        mkdir -p ~/.local/bin
        curl --fail --location --silent --show-error https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz -o mdbook.tar.gz
        echo "9ef07fd288ba58ff3b99d1c94e6d414d431c9a61fdb20348e5beb74b823d546b  mdbook.tar.gz" | sha256sum --check --strict
        tar xzf mdbook.tar.gz -C ~/.local/bin
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Linting Markdown Files
      uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
      with:
        globs: '**/*.md'

    - name: Preprocess
      run: |
        chmod +x ./scripts/*.sh
        bash ./scripts/agents_summary.sh
        bash ./scripts/agents_meta.sh
        bash ./scripts/build_date.sh

    - name: MdBook Test
      run: |
        mdbook test

    - name: Install mdbook-linkcheck
      run: |
        mkdir -p mdbook-linkcheck
        curl --fail --location --silent --show-error https://github.com/Michael-F-Bryan/mdbook-linkcheck/releases/download/v0.7.7/mdbook-linkcheck.x86_64-unknown-linux-gnu.zip -o mdbook-linkcheck/mdbook-linkcheck.zip
        echo "18cebca9493804b307b39a44af2664cdfa881e84b8d92a94205d6c51572318ef  mdbook-linkcheck/mdbook-linkcheck.zip" | sha256sum --check --strict
        unzip -d ./mdbook-linkcheck mdbook-linkcheck/mdbook-linkcheck.zip
        chmod +x mdbook-linkcheck/mdbook-linkcheck
        echo "$PWD/mdbook-linkcheck" >> "$GITHUB_PATH"

    - name: Build
      run: mdbook build

    - name: Store Book Artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: book
        path: book